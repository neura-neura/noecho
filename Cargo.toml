[workspace]
resolver = "2"
members = [
  "crates/audio-core",
  "crates/tech-probe",
  "src-tauri",
]
default-members = ["crates/tech-probe"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["NoEcho"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
once_cell = "1"
